syntax = "proto3";

package booking;
option go_package = "booking/gen/bookingpb";

import "google/protobuf/timestamp.proto";

enum BookingStatus {
    BOOKING_STATUS_UNSPECIFIED = 0;
    BOOKING_STATUS_CREATED = 1;
    BOOKING_STATUS_PAYMENT_REQUIRED = 2;
    BOOKING_STATUS_PENDING = 3;
    BOOKING_STATUS_CONFIRMED = 4;
    BOOKING_STATUS_CANCELLED = 5;
}

message Booking {
    string id = 1;
    string user_id = 2;
    string place_id = 3;        
    Place place = 4;              
    BookingDetails details = 5;
    BookingStatus status = 6;
    google.protobuf.Timestamp created_at = 7;  
    repeated string participant_ids = 8;
    float total_price = 9;       
}

message BookingDetails {
    string description = 1;       
    int32 participants = 2;
    map<string, string> extras = 3; 
}

message Place {
    string id = 1;
    string name = 2;
    string address = 3;
    string description = 4;
    string category = 5;           
    repeated string facilities = 6;
    float base_price = 7;          
    google.protobuf.Timestamp available_from = 8;
    google.protobuf.Timestamp available_to = 9;
}

service BookingService {
    rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse);
    rpc GetBooking(GetBookingRequest) returns (GetBookingResponse);
    rpc GetBookingsByUserID(GetBookingsByUserIdRequest) returns (GetBookingsByUserIdResponse);
    rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse);
    
    rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse);
    rpc ListBookingsByPlace(ListByPlaceRequest) returns (ListByPlaceResponse);
    
    rpc GetPlace(GetPlaceRequest) returns (GetPlaceResponse);
    rpc ListPlaces(ListPlacesRequest) returns (ListPlacesResponse);
    rpc SearchPlaces(SearchPlacesRequest) returns (SearchPlacesResponse);
}

message CreateBookingRequest {
    string user_id = 1;
    string place_id = 2;           
    BookingDetails details = 3;
    repeated string participant_ids = 4;
}

message CreateBookingResponse {
    string id = 1;
    string status = 2;
    Place place = 3;               
}

message GetBookingRequest {
    string id = 1;
}

message GetBookingResponse {
    Booking booking = 1;
}

message GetBookingsByUserIdRequest {
    string user_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message GetBookingsByUserIdResponse {
    repeated Booking bookings = 1;
}

message CancelBookingRequest {
    string id = 1;
}

message CancelBookingResponse {
    bool success = 1;
    string message = 2;
}

message ListBookingsRequest {
    string status = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message ListBookingsResponse {
    repeated Booking bookings = 1;
    int32 total = 2;
}

message ListByPlaceRequest {
    string place_id = 1;          
    int32 limit = 2;
    int32 offset = 3;
    string status = 4;
}

message ListByPlaceResponse {
    repeated Booking bookings = 1;
    int32 total = 2;
}

message GetPlaceRequest {
    string id = 1;
}

message GetPlaceResponse {
    Place place = 1;
}

message ListPlacesRequest {
    int32 limit = 1;
    int32 offset = 2;
    string category = 3;  
}

message ListPlacesResponse {
    repeated Place places = 1;
    int32 total = 2;
}

message SearchPlacesRequest {
    string query = 1;      
    string category = 2;
    int32 limit = 3;
}

message SearchPlacesResponse {
    repeated Place places = 1;
}
